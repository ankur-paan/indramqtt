[package]
name = "broker-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
async-trait = { workspace = true }
broker-rules = { workspace = true }
broker-protocol = { workspace = true }
broker-session = { workspace = true }
broker-router = { workspace = true }
broker-observability = { workspace = true }
broker-auth = { workspace = true }
broker-config = { workspace = true }
brokerlink = { workspace = true }
broker-connectors = { workspace = true }
broker-connectors-enterprise = { workspace = true }
broker-storage = { workspace = true }
broker-cluster = { workspace = true }
broker-gateway = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

[features]
# Mirrors the X1-09 connector feature set so `register_live_sink` can fail
# closed naming the missing feature. Each forwards to the owning crate:
# `s3` to `broker-connectors`, the rest to `broker-connectors-enterprise`.
# Default build matches those crates' defaults (all gated kinds absent).
default = []
s3 = ["broker-connectors/s3"]
aws_iot = ["broker-connectors-enterprise/aws_iot"]
azure_blob = ["broker-connectors-enterprise/azure_blob"]
azure_eventhubs = ["broker-connectors-enterprise/azure_eventhubs"]
azure_iot = ["broker-connectors-enterprise/azure_iot"]
bigquery = ["broker-connectors-enterprise/bigquery"]
dynamodb = ["broker-connectors-enterprise/dynamodb"]
gcp_iot = ["broker-connectors-enterprise/gcp_iot"]

[dev-dependencies]
broker-connectors = { workspace = true }
async-trait = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
p256 = "0.13"
