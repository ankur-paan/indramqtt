[package]
name = "broker-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "indramqtt"
path = "src/main.rs"

[[bin]]
name = "indra"
path = "src/indra.rs"

[[test]]
name = "e2e_integration"
path = "../../tests/e2e_integration.rs"

[[test]]
name = "soak_chaos_suite"
path = "../../tests/soak_chaos_suite.rs"

[[test]]
name = "mt_publish_bench"
path = "../../tests/mt_publish_bench.rs"

[dependencies]
brokerlink = { workspace = true }
broker-protocol = { workspace = true }
broker-router = { workspace = true }
broker-session = { workspace = true }
broker-storage = { workspace = true }
broker-auth = { workspace = true }
broker-config = { workspace = true }
broker-rules = { workspace = true }
broker-rules-enterprise = { workspace = true }
broker-connectors = { workspace = true }
broker-cluster = { workspace = true }
broker-api = { workspace = true }
broker-observability = { workspace = true }
broker-gateway = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }

[features]
# Each feature adds one connector kind to the build. With a feature off,
# the registration of that kind fails with an error that names the
# feature. `full` is the set for release builds and for the image.
default = []
s3 = ["broker-api/s3"]
aws_iot = ["broker-api/aws_iot"]
azure_blob = ["broker-api/azure_blob"]
azure_eventhubs = ["broker-api/azure_eventhubs"]
azure_iot = ["broker-api/azure_iot"]
bigquery = ["broker-api/bigquery"]
dynamodb = ["broker-api/dynamodb"]
gcp_iot = ["broker-api/gcp_iot"]
full = [
    "s3",
    "aws_iot",
    "azure_blob",
    "azure_eventhubs",
    "azure_iot",
    "bigquery",
    "dynamodb",
    "gcp_iot",
]

[dev-dependencies]
flate2 = { workspace = true }
yamldap = "0.2"
tempfile = "3"
base64 = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
jsonwebtoken = { workspace = true }
rustls = { version = "0.23.45" }
tokio-rustls = { version = "0.26" }
rustls-pemfile = { version = "1" }
ring = "0.17"
picky-krb = "0.12"
picky-asn1 = { version = "0.10", features = ["time_conversion"] }
picky-asn1-der = "0.5"
time = "0.3"
