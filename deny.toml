[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "LicenseRef-Indra-Enterprise",
]
confidence-threshold = 0.8

exceptions = [
    { allow = ["MIT", "Apache-2.0"], crate = "rekuiper-core" },
    { allow = ["MIT", "Apache-2.0"], crate = "rekuiper-sql" },
    { allow = ["MIT", "Apache-2.0"], crate = "rekuiper-conf" },
    # Mozilla root-certificate data. The licence covers the data, puts no
    # condition on our code, and is scoped to this crate alone.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Keccak hash via the MongoDB driver. CC0-1.0 is a public-domain
    # dedication with no conditions; scoped to this crate alone.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[licenses.private]
ignore = true

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2024-0363",
    "RUSTSEC-2024-0399",
    "RUSTSEC-2023-0052",
    "RUSTSEC-2023-0053",
    "RUSTSEC-2024-0336",
]

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    "https://github.com/ankur-paan/rekuiper.git",
]
