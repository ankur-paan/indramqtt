name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# One run for each pull request. A new push to a pull request stops the run
# that is in progress, thus two runs for the same branch do not
# use the runners at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-check:
    name: Rust Core (Check, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check management API stores are driven by the broker
        run: bash tools/wiring_check.sh

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Cargo check (all targets)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (zero warnings policy)
        run: cargo clippy --workspace --all-targets -- -D warnings -A unknown-lints -A clippy::chunks_exact_to_as_chunks

      - name: Cargo clippy with all connector features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A unknown-lints -A clippy::chunks_exact_to_as_chunks

      - name: Cargo test suite
        run: cargo test --workspace --verbose

      # The connector kinds behind Cargo features have tests that the
      # default build does not compile. This step runs them.
      - name: Cargo test suite with all connector features
        run: cargo test --workspace --all-features

  deep-soak-and-chaos:
    name: Deep Soak, Multi-Target Sinks & Chaos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run E2E Integration Suite
        run: cargo test -p broker-node --test e2e_integration -- --nocapture

      - name: Run Deep Soak & Chaos Test Suite
        run: cargo test -p broker-node --test soak_chaos_suite -- --nocapture

  boot-smoke:
    # This job starts the built broker from an indra.toml file. It
    # examines the behaviour through the sockets. A setting that the
    # broker accepts but does not apply fails this job.
    name: Boot Smoke (broker from indra.toml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the kernel and the operator CLI
        run: cargo build -p broker-node --features full --bins

      - name: Run the boot test
        run: bash tools/boot_smoke.sh target/debug

  api-conformance:
    name: API Conformance (offline unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run conformance validator unit tests
        run: python -m unittest tests.api_conformance.test_openapi_validate -v
        # Local live run (needs spec path + running kernel, not in CI):
        # python -m tests.api_conformance --spec <openapi.json> --base http://127.0.0.1:18083/api/v5 --user admin --password <pw>

  benchmarks:
    name: Benchmark Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build benchmarks
        run: cargo test --release --bench broker_throughput --no-run

  cargo-deny:
    name: Security & License Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the crate-refusal gate failure paths
        run: python3 tools/test_refuse_removed_crates.py -v

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Refuse the removed vulnerable and unmaintained crates
        run: python3 tools/refuse_removed_crates.py

  docs-site:
    name: Docs Site Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # The deployed site builds from docs/. A page that the site cannot
      # read (front matter without a title, YAML that does not parse)
      # stops the deployment, so it stops the pull request first.
      - name: Build the docs site
        working-directory: docs-site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Test the link plugin
        working-directory: docs-site
        run: npm test

      - name: Test the link checker
        run: python3 tools/test_check_site_links.py -v

      # A page can build and still hold links that return 404. This step
      # follows every link and anchor of the built site.
      - name: Check every link of the built site
        run: python3 tools/check_site_links.py docs-site/dist
