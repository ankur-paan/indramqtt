[package]
name = "license-signer"
version = "0.1.0"
edition = "2021"
description = "Offline enterprise licence signing tool (outside workspace build)"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
