name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-check:
    name: Rust Core (Check, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check management API stores are driven by the broker
        run: bash tools/wiring_check.sh

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Cargo check (all targets)
        run: cargo check --workspace --all-targets

      - name: Cargo clippy (zero warnings policy)
        run: cargo clippy --workspace --all-targets -- -D warnings -A unknown-lints -A clippy::chunks_exact_to_as_chunks

      - name: Cargo test suite
        run: cargo test --workspace --verbose

  deep-soak-and-chaos:
    name: Deep Soak, Multi-Target Sinks & Chaos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run E2E Integration Suite
        run: cargo test -p broker-node --test e2e_integration -- --nocapture

      - name: Run Deep Soak & Chaos Test Suite
        run: cargo test -p broker-node --test soak_chaos_suite -- --nocapture

  beam-eunit:
    name: BEAM Network Edge (EUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Erlang/OTP & Rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          rebar3-version: '3.22.1'

      - name: Compile BEAM edge
        working-directory: beam
        run: rebar3 compile

      - name: Run EUnit test suites
        working-directory: beam
        run: rebar3 eunit

  api-conformance:
    name: API Conformance (offline unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run conformance validator unit tests
        run: python -m unittest tests.api_conformance.test_openapi_validate -v
        # Local live run (needs spec path + running kernel, not in CI):
        # python -m tests.api_conformance --spec <openapi.json> --base http://127.0.0.1:18083/api/v5 --user admin --password <pw>

  benchmarks:
    name: Benchmark Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build benchmarks
        run: cargo test --release --bench broker_throughput --no-run

  cargo-deny:
    name: Security & License Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
