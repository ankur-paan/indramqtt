name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: indramqtt-x86_64-unknown-linux-gnu
            binary_path: target/x86_64-unknown-linux-gnu/release/broker-node
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: indramqtt-aarch64-unknown-linux-gnu
            binary_path: target/aarch64-unknown-linux-gnu/release/broker-node
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: indramqtt-x86_64-apple-darwin
            binary_path: target/x86_64-apple-darwin/release/broker-node
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: indramqtt-aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/broker-node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p broker-node

      - name: Package release artifact
        run: |
          mkdir dist
          cp ${{ matrix.binary_path }} dist/indramqtt
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist indramqtt

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
