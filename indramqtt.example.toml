# =============================================================================
# IndraMQTT Production Configuration Template
# Official Website: https://indramqtt.com
# Documentation: upcoming
# =============================================================================
# Every key below has exactly one typed home in the configuration schema
# (crates/broker-config/src/schema.rs): its type, default, valid range and
# documentation string live there. Wrong types and out-of-range values are
# startup errors naming the setting. Regenerate the reference and JSON
# Schema with `bash tools/gen_config_schema.sh`.

[node]
# Unique identifier for this broker node within the cluster
id = "indra-node-1"

# Data directory for persistent segmented logs and cursor metadata
data_dir = "/var/lib/indramqtt/data"

# BrokerLink IPC listen address for edge clients (TCP loopback)
brokerlink_bind = "127.0.0.1:18883"

# =============================================================================
# Network Listeners
# =============================================================================

[listeners.tcp]
# Standard plaintext MQTT listener
enabled = true
bind = "0.0.0.0:1883"
max_connections = 1000000
backlog = 1024

[listeners.tls]
# Secure TLS MQTT listener
enabled = false
bind = "0.0.0.0:8883"
cert_file = "/etc/indramqtt/certs/server.crt"
key_file = "/etc/indramqtt/certs/server.key"

[listeners.ws]
# Binary MQTT-over-WebSocket listener (older files may use
# `[listeners.websocket]`; it is accepted as an alias of `[listeners.ws]`)
enabled = true
bind = "0.0.0.0:8083"
path = "/ws/mqtt"

[listeners.wss]
# Secure WebSocket listener (disabled by default)
enabled = false
bind = "0.0.0.0:8084"
path = "/ws/mqtt"
cert_file = ""
key_file = ""

[listeners.api]
# Axum REST Management API & Embedded Web Dashboard SPA
enabled = true
bind = "0.0.0.0:18083"

# =============================================================================
# Multi-Tenant Quotas & Rate Limiting
# =============================================================================

[quotas]
# Default max connections per authenticated username (0 = unlimited)
default_max_connections = 10000

# Default token-bucket publish rate limit in messages per second (0 = unlimited)
default_max_publish_rate = 50000

# Token bucket burst multiplier (allows burst up to burst * rate)
burst_multiplier = 2.0

# =============================================================================
# Session & Protocol Invariants
# =============================================================================

[session]
# Max session expiry interval in seconds
max_session_expiry_secs = 86400

# Maximum queued offline messages per session
max_offline_queue = 50000

# Maximum inflight unacknowledged QoS 1 and QoS 2 messages
max_inflight_messages = 65535

# Per-subscriber QoS 0 egress backlog bound (D1-02). Each live
# connection queues at most this many QoS 0 messages; past it the oldest
# queued QoS 0 frame drops (counted via `egress_qos0_shed`, labelled by
# client) so a slow consumer costs bounded memory and never slows
# publishers. QoS 1/2 never shed. Default 1000 matches the detached
# offline bound and caps per-subscriber QoS 0 memory near 1,000 small
# frames. Override at boot with `indramqtt --qos0-backlog <n>`.
max_qos0_backlog = 1000

# Keep-alive grace multiplier (allows up to keep_alive * multiplier before disconnect)
keep_alive_grace = 1.5

# =============================================================================
# Logging
# =============================================================================

[logging]
# Logging verbosity for the kernel (trace, debug, info, warn, error).
# Previously written as `node.log_level`; that key was moved here so every
# setting has one home.
level = "info"

# =============================================================================
# Embedded Stream Processing Engine tuning
# =============================================================================

[rules_engine]
# Ingress ring buffer channel depth for stateful window worker tasks
window_channel_depth = 65536

# Default memory backpressure policy when buffer is full:
# Options: Block, DropNewest, DropOldest, SpillToDisk, RejectPublisher
backpressure_policy = "DropOldest"

# On-disk spill directory for the SpillToDisk backpressure policy
# (kernel flag --rule-spill-dir). Empty (the default) keeps the memory-only
# input: overflow is refused. Set to a dedicated directory to append
# overflow rule-ingress events to a bounded on-disk buffer (1 MiB
# segments, 64 MiB total) that replays in order and survives a restart.
# spill_dir = ""

# =============================================================================
# Authentication & Authorization (ACL)
# =============================================================================

[auth]
# Enable authentication checks
enabled = true

# Password hashing algorithm (sha256, bcrypt)
password_hash = "sha256"

# Anonymous connections policy. Explicit opt-in: the schema default is
# deny (false); this template allows anonymous while no users exist.
allow_anonymous = true

# Superuser usernames bypassing ACL rules
superusers = ["admin", "root"]

# =============================================================================
# Distributed Clustering (Enterprise Edition)
# =============================================================================

[cluster]
# Enable multi-node distributed clustering mesh
enabled = false

# Cluster SWIM UDP bind address for peer discovery and membership (--cluster-bind)
bind = "127.0.0.1:19883"

# Gossip membership bind address for peer discovery
gossip_bind = "0.0.0.0:7946"

# Multiplexed data plane bind address for inter-broker message routing
quic_bind = "0.0.0.0:9092"

# Seed node addresses to join existing cluster
seed_nodes = []

# =============================================================================
# Commercial Licence
# =============================================================================

[licence]
# Path to enterprise cryptographic license key file (previously
# `cluster.license_file`; moved here so licensing has one home)
license_file = "/etc/indramqtt/license.key"

# Enterprise commercial license key (or via INDRA_LICENSE_KEY env)
license_key = ""

# Trusted licence-signing keys: a JSON file or directory of JSON files
trusted_keys_path = ""

# Write the installation licence request to this path and exit
request_out = ""

# Install the licence token read from this path and exit
install_file = ""

# Days before expiry that the approaching-expiry alarm and log warning start
expiry_warn_days = 30

# =============================================================================
# Protocol Gateways
# =============================================================================

[gateway]
# CoAP gateway UDP listen address. Empty disables the gateway.
coap_bind = ""

# =============================================================================
# Durable Persistence
# =============================================================================

[persistence]
# Durable stream journal directory. Empty disables journaling.
stream_dir = ""

# =============================================================================
# LDAP Directory Authentication
# =============================================================================

[ldap]
# Directory server URL. Empty disables LDAP.
server_url = ""
base_dn = ""
bind_dn = ""
bind_password = ""
user_filter = "(uid={username})"
group_attribute = "memberOf"
required_group = ""
ca_cert_path = ""
pool_size = 8
connect_timeout_ms = 5000
read_timeout_ms = 5000

# =============================================================================
# Kerberos Authentication
# =============================================================================

[kerberos]
# Keytab file. Empty disables Kerberos.
keytab_path = ""
service_principal = ""
realm = ""
allowed_realms = []
clock_skew_secs = 300
role_map = ""
replay_max_entries = 1024
