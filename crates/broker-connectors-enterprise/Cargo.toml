[package]
name = "broker-connectors-enterprise"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Indra-Enterprise"
repository.workspace = true

[dependencies]
broker-connectors = { workspace = true }
broker-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23.45" }
tokio-rustls = { version = "0.26" }
rustls-pemfile = { version = "2" }
rustls-pki-types = { version = "1" }
rustls-native-certs = { version = "0.8" }
webpki-roots = { version = "0.25" }
tokio-postgres = { version = "0.7" }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs"] }
google-cloud-auth = { version = "1" }
gcp-bigquery-client = { version = "0.28", default-features = false, features = ["native-tls", "aws-lc-rs"], optional = true }
scylla = { version = "1.9" }
clickhouse = { version = "0.15", features = ["native-tls"] }
aws-sigv4 = { version = "1", optional = true }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }
# Redshift sink on the maintained official driver (Apache-2.0):
# `BatchExecuteStatement` with driver-owned SigV4 (static access-key
# credentials, session token when configured, endpoint override for
# local servers) plus `DescribeStatement` polling to FINISHED.
# The hand-written `HttpRedshiftTransport` stays for offline unit tests
# only; production wiring uses `SdkRedshiftTransport` below.
aws-sdk-redshiftdata = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# Kinesis sink on the maintained official driver (Apache-2.0):
# `PutRecords` with driver-owned SigV4 (static access-key credentials,
# session token when configured, endpoint override for local servers).
# The hand-written `HttpKinesisTransport` stays for offline unit tests
# only; production wiring uses `SdkKinesisTransport` below.
aws-sdk-kinesis = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# S3 / MinIO sink on the maintained official driver (Apache-2.0):
# `PutObject` with driver-owned SigV4 (static access-key credentials,
# endpoint override for local servers, path-style for IP endpoints).
# Multipart above the 5 MiB vendor part minimum rides
# `CreateMultipartUpload` / `UploadPart` / `CompleteMultipartUpload`.
# The hand-written `HttpS3Transport` stays for offline unit tests
# only; production wiring uses `SdkS3Transport` below.
futures = { workspace = true }
rdkafka = { version = "0.39", features = ["ssl"] }
schema-registry-client = { version = "0.4" }
# Elasticsearch/OpenSearch bulk sink on the maintained official driver
# (Apache-2.0). `http` (MIT/Apache-2.0) builds the per-request headers.
# Pinned to the latest 8.x prerelease: the `elasticsearch` crate has no
# stable 8.x on crates.io (only `-alpha.1` prereleases), so a plain
# `version = "8"` never resolves and the gates fail version selection.
elasticsearch = { version = "8.19.0-alpha.1" }
http = { version = "1" }
# Couchbase sink on the maintained official driver (Apache-2.0). The
# hand-written `NativeCouchbaseTransport` stays for offline unit tests
# only; production wiring uses `DriverCouchbaseTransport` below.
couchbase = { version = "1" }
# MySQL / MariaDB sink on the maintained `mysql_async` driver
# (MIT/Apache-2.0): native protocol (handshake, mysql_native_password +
# caching_sha2_password, COM_STMT_PREPARE/EXECUTE) with driver-owned
# pooling. The hand-written `TcpMySqlTransport` stays for offline unit
# tests only; production wiring uses `DriverMySqlTransport`.
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust"] }
# MongoDB sink on the maintained official driver (Apache-2.0 + MIT).
# The hand-written `NativeMongoDbTransport` (OP_MSG + SCRAM-SHA-256)
# stays for offline unit tests only; production wiring uses
# `DriverMongoDbTransport` below (bulk insert, collection routing).
# Uses `rustls-tls-aws-lc` (not default `rustls-tls`/ring): the workspace
# enables exactly one rustls provider (`aws-lc-rs`), and enabling both
# `ring` and `aws_lc_rs` makes `CryptoProvider::from_crate_features`
# ambiguous so `get_default_or_install_from_crate_features` panics.
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "dns-resolver", "rustls-tls-aws-lc"] }
# Google Cloud Pub/Sub sink on the maintained official driver
# (Apache-2.0). The sink publishes through `google-cloud-pubsub` gRPC
# `Publisher` (base64 data, ordering keys, attributes); the hand-written
# REST `HttpGcpPubSubTransport` is retained for offline unit tests only.
google-cloud-pubsub = { version = "1" }
# Error-code mapping for the Pub/Sub driver tests (Apache-2.0).
google-cloud-gax = { version = "1" }
# Remote MQTT bridge sink on the maintained `rumqttc` driver
# (Apache-2.0). Plain TCP only (`default-features = false`, no TLS
# backend): `mqtts://` endpoints fail closed with a clear error until
# a TLS backend lands. This also keeps the advisory-pinned
# `rustls-webpki 0.102` (pulled by rumqttc's `use-rustls` feature)
# out of the tree.
rumqttc = { version = "0.25", default-features = false }
# Sparkplug B Tahu Protobuf codec on the maintained `prost` driver
# (Apache-2.0): `ProtoPayload` / `ProtoMetric` mirror the clean-room
# field numbers, and the sink write path encodes through them.
prost = { version = "0.13" }
# RabbitMQ sink on the maintained `lapin` driver (MIT): AMQP 0-9-1
# (PLAIN handshake, Basic.Publish with content header/body frames via
# the driver). The hand-written `TcpRabbitTransport` stays for offline
# unit tests only; production wiring uses `LapinRabbitTransport`.
# `rustls` rides the workspace's single crypto provider (`aws-lc-rs`):
# requesting `rustls--ring` as well would enable both `ring` and
# `aws-lc-rs` for `rustls`, and `CryptoProvider::from_crate_features`
# then returns `None` so every `ClientConfig::builder` panics.
lapin = { version = "4", default-features = false, features = ["tokio", "rustls"] }
# Redis sink on the maintained `redis` driver (BSD-3-Clause): RESP with
# AUTH/SELECT from the URL, multiplexed tokio connection, pipelining via
# `redis::pipe`. The hand-written `TcpRedisTransport` stays for offline
# unit tests only; production wiring uses `DriverRedisTransport`.
# Pinned to the 0.25 line: redis 1.x pulls `xxhash-rust` (BSL-1.0)
# unconditionally, which the licence gate rejects, while 0.25 exposes
# the same RESP/AUTH/SELECT/multiplexed API without it.
redis = { version = "0.25", default-features = false, features = ["tokio-comp"] }
# Microsoft SQL Server sink on the maintained `tiberius` driver
# (MIT/Apache-2.0): TDS (PRELOGIN, LOGIN7, sp_executesql) with SQL auth
# and typed params over tokio (`tokio-util` compat). The hand-written
# `NativeMssqlTransport` stays for offline unit tests only; production
# wiring uses `DriverMssqlTransport` below.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "tokio", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
# TDengine sink on the maintained `reqwest` REST SQL driver
# (MIT/Apache-2.0): `POST {base}/rest/sql/{database}` carrying the
# same `INSERT INTO ... USING ... TAGS ...` text, with Basic auth and
# driver-owned connection setup. The spec named the official `taos`
# client, but every `taos` 0.12 line pulls denied `ring` 0.16.20 and
# `parse_duration` 2.1.1, so the spec cannot pass the licence gate.
# The hand-written `HttpTdengineTransport` stays for token/TLS configs
# and offline unit tests; production wiring uses
# `DriverTdengineTransport` below (`reqwest` REST, Basic + plaintext).

[features]
# Default build: light enterprise sinks only (no cloud-IoT/cloud-store
# SDKs from X1-09). Each heavy SDK/sink is off unless its feature is
# enabled. X1-09 gates the first half (cloud-IoT + cloud-store):
# `aws_iot`, `azure_iot`, `gcp_iot`, `dynamodb`, `bigquery`,
# `azure_blob`, `azure_eventhubs`. X1-10 gates the rest. A feature build
# (e.g. `--features dynamodb`) restores that sink; the release set (or
# `--all-features`) restores all.
default = []
aws_iot = ["dep:aws-sigv4"]
dynamodb = ["dep:aws-sdk-dynamodb"]
bigquery = ["dep:gcp-bigquery-client"]
azure_blob = []
azure_eventhubs = []
azure_iot = []
gcp_iot = []

[dev-dependencies]
axum = { workspace = true }
apache-avro = { version = "0.15" }
broker-rules = { workspace = true }
