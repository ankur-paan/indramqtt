[package]
name = "broker-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
broker-protocol = { workspace = true }
broker-connectors = { workspace = true }
broker-config = { workspace = true }
broker-observability = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
rekuiper-sql = { git = "https://github.com/ankur-paan/rekuiper.git" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
broker-connectors-enterprise = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }

[features]
# X1-09: mirrors the enterprise cloud-IoT/cloud-store gates so the e2e
# below builds both with default features (gated tests absent) and with
# `--features <name>` (each gated test runs). Each forwards to the owning
# enterprise crate feature.
default = []
aws_iot = ["broker-connectors-enterprise/aws_iot"]
azure_blob = ["broker-connectors-enterprise/azure_blob"]
azure_eventhubs = ["broker-connectors-enterprise/azure_eventhubs"]
azure_iot = ["broker-connectors-enterprise/azure_iot"]
bigquery = ["broker-connectors-enterprise/bigquery"]
dynamodb = ["broker-connectors-enterprise/dynamodb"]
gcp_iot = ["broker-connectors-enterprise/gcp_iot"]
